<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobile Preview - My Portfolio</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 24px 12px;
      background: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      color: #f8fafc;
    }
    .header-bar {
      margin-bottom: 20px;
      text-align: center;
    }
    .header-bar h2 {
      margin: 0 0 6px 0;
      color: #38bdf8;
      font-size: 22px;
    }
    .header-bar p {
      margin: 0;
      color: #94a3b8;
      font-size: 14px;
    }
    .device-controls {
      display: flex;
      gap: 8px;
      margin-top: 14px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .device-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #cbd5e1;
      padding: 7px 15px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s ease;
    }
    .device-btn.active, .device-btn:hover {
      background: #0284c7;
      border-color: #38bdf8;
      color: #ffffff;
      font-weight: 600;
    }
    /* Phone Mockup Frame */
    .smartphone {
      position: relative;
      width: 375px;
      height: 740px;
      background: #000000;
      border-radius: 48px;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.8), 0 0 0 4px #334155, 0 0 0 8px #1e293b;
      padding: 12px;
      transition: width 0.3s ease, height 0.3s ease;
      display: flex;
      flex-direction: column;
    }
    /* Dynamic Island / Notch */
    .notch {
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      width: 110px;
      height: 24px;
      background-color: #000000;
      border-radius: 20px;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      box-shadow: 0 0 4px rgba(255, 255, 255, 0.1);
    }
    .camera {
      width: 9px;
      height: 9px;
      background: #0f172a;
      border-radius: 50%;
      border: 1px solid #1e293b;
    }
    .speaker {
      width: 36px;
      height: 4px;
      background: #1e293b;
      border-radius: 2px;
    }
    /* Screen content */
    .screen-content {
      width: 100%;
      height: 100%;
      border-radius: 36px;
      overflow: hidden;
      background: #ffffff;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <div class="header-bar">
    <h2>📱 মোবাইল ভিউ সিমুলেটর (Mobile Screen)</h2>
    <p>আপনার পোর্টফোলিও ওয়েবসাইট মোবাইলে সরাসরি দেখতে ও টেস্ট করতে নিচের ফ্রেমটি ব্যবহার করুন:</p>
    <div class="device-controls">
      <button class="device-btn active" onclick="setSize(375, 740, this)">iPhone / স্ট্যান্ডার্ড (375px)</button>
      <button class="device-btn" onclick="setSize(414, 780, this)">iPhone Pro Max (414px)</button>
      <button class="device-btn" onclick="setSize(390, 750, this)">Android ফোন (390px)</button>
    </div>
  </div>

  <div class="smartphone" id="phoneContainer">
    <div class="notch">
      <div class="camera"></div>
      <div class="speaker"></div>
    </div>
    <div class="screen-content">
      <iframe src="index.html"></iframe>
    </div>
  </div>

  <script>
    function setSize(width, height, btn) {
      const container = document.getElementById('phoneContainer');
      container.style.width = width + 'px';
      container.style.height = height + 'px';
      document.querySelectorAll('.device-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }
  </script>
</body>
</html>
